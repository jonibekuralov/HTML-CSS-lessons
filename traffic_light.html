<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #traffic_box{
            width: 250px;
            height: 500px;
            background-color: black;
            margin: auto;
        }
        .light1{
            width: 150px;
            height: 150px;
            background-color: red;
            animation-name: light1;
            animation-duration: 4s;
            border-radius: 100px;
        }
        .light2{
            width: 150px;
            height: 150px;
            background-color:yellow;
            animation-name: light1;
            animation-duration: 4s;
            border-radius: 100px;
        }
        .light3{
            width: 150px;
            height: 150px;
            background-color: green;
            animation-name: light1;
            animation-duration: 4s;
            border-radius: 100px;
        }

        .light{
            margin-top: 15px;
            margin-left:45px;
        }
    </style>
</head>
<body>
    <div id="traffic_box">
        <div class="light light1"></div>
        <div class="light light2"></div>
        <div class="light light3"></div>

    </div>
</body>
</html>
